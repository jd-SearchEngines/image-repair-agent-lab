[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-repair-agent-lab"
version = "0.1.0"
description = "Auditable diagnose-route-repair-QA experiments for image repair agents"
requires-python = ">=3.9"
dependencies = ["Pillow>=9.0", "numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
